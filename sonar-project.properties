# SonarQube — análisis estático del monorepo Nx
# Ejecutar con: pwsh scripts/sonar-scan.ps1  (requiere SonarQube levantado, ver infra/sonarqube)

sonar.projectKey=nachopps-restobar
sonar.projectName=Nachopps Restobar
sonar.projectVersion=1.0

sonar.sources=apps,libs
sonar.tests=apps,libs
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/jest.config.ts,**/vite.config.*,**/webpack.config.*,**/*-e2e/**

sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPaths=tsconfig.base.json

# Cobertura: generar antes con `npm exec nx run-many -t test -- --coverage`
sonar.javascript.lcov.reportPaths=coverage/**/lcov.info

# Quality gate: esperar resultado en CI
sonar.qualitygate.wait=true

sonar.coverage.exclusions=apps/pwa-cliente/src/**,apps/servicio-caja/**,apps/servicio-cuentas/**,apps/servicio-identidad/**,apps/servicio-inventario/**,apps/servicio-mesas/**,apps/servicio-notificaciones/**,apps/servicio-reportes/**,apps/servicio-reservas/**,**/servicio-pedidos/src/app/app.controller.ts,**/servicio-pedidos/src/app/app.service.ts,**/servicio-pedidos/src/app/events.controller.ts,**/servicio-pedidos/src/app/inventario-http.client.ts,**/servicio-pedidos/src/app/mesas-http.client.ts,libs/shared-auth/**



