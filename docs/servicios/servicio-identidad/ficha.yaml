# Ficha de catalogo de servicio (gobierno de servicios, sesion 31).
# Fuente de endpoints/eventos: _indice.md y docs/eventos/_catalogo.md.
serviceName: servicio-identidad
domain: plataforma
businessCapability: Autenticar usuarios (JWT RS256 en cookie httpOnly) y administrar roles del personal
ownerTeam: plataforma-team
technicalOwner: tech-lead-plataforma
businessOwner: gerencia-ti
status: active
criticality: high
apiVersion: v1
port: 3001
contracts:  # generado desde openapi.json (npm run contratos:openapi)
  - GET /api
  - POST /api/auth/login
  - POST /api/auth/logout
  - GET /api/auth/me
  - POST /api/auth/refresh
  - GET /api/outbox/failed
  - POST /api/outbox/{id}/retry
  - GET /api/telemetry/metrics
  - GET /api/usuarios
  - POST /api/usuarios
  - PATCH /api/usuarios/{id}/rol
eventsPublished: []
eventsConsumed: []
dependencies:
  - postgres (base propia: identidad)
  - rabbitmq (publicacion outbox)
docs:
  indice: docs/servicios/servicio-identidad/_indice.md
  openapi: docs/servicios/servicio-identidad/openapi.json
  runbook: docs/operacion/runbooks/servicio-identidad.md
  ownership: docs/gobierno/ownership.md
  trazabilidad: docs/gobierno/trazabilidad.md
  changelog: CHANGELOG.md
  adrs:
    - docs/decisiones/ADR-001-database-per-service.md
    - docs/decisiones/ADR-002-transactional-outbox.md
