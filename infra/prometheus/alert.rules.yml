groups:
- name: CheckoutAlerts
  rules:
  - alert: ERP_P95_LatencyHigh
    expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{instance="servicio-inventario:3000"}[5m])) by (le)) > 5
    for: 5m
    labels:
      severity: warning
      owner: servicio-inventario
    annotations:
      summary: "ERP p95 alto"
      description: "La latencia p95 del ERP (inventario) ha superado los 5 segundos durante los últimos 5 minutos."
      action: "Revisar dependencias del inventario"

  - alert: ErpTimeoutRateHigh
    expr: increase(dependency_timeout_total{dependency="inventario"}[5m]) > 5
    labels:
      severity: critical
      owner: servicio-pedidos
    annotations:
      summary: "ERP timeout rate alto"
      description: "Más de 5 timeouts al llamar al ERP (inventario) en los últimos 5 minutos."
      action: "Revisar disponibilidad/latencia de servicio-inventario"

  # Análogo de PAYMENT_UNKNOWN en NachoPps: el pago se registró en caja pero el
  # cierre remoto de la cuenta (HTTP a servicio-cuentas) falló — ver [[pagos_cierre_remoto_pendiente_total]].
  - alert: PagoCierrePendienteHigh
    expr: increase(pagos_cierre_remoto_pendiente_total[10m]) > 5
    labels:
      severity: critical
      owner: servicio-caja
    annotations:
      summary: "Pagos con cierre de cuenta sin confirmar > 5 en 10 min"
      description: "Varios pagos quedaron registrados en caja sin que la cuenta se cerrara en servicio-cuentas."
      action: "Soporte + reconciliación manual de cuentas abiertas con pago registrado"

  - alert: ERPCircuitBreakerOpen
    expr: circuit_breaker_state{dependency="inventario"} == 1
    for: 2m
    labels:
      severity: warning
      owner: servicio-pedidos
    annotations:
      summary: "Circuit breaker de inventario abierto"
      description: "El Circuit Breaker para el ERP (inventario) lleva ABIERTO más de 2 minutos."
      action: "Degradación controlada. Revisar logs del ERP."

  - alert: OutboxPendingHigh
    expr: sum(outbox_pending_total) > 200
    for: 1m
    labels:
      severity: warning
      owner: plataforma
    annotations:
      summary: "Outbox pending alto"
      description: "Se acumulan eventos en la base de datos sin enviar al broker."
      action: "Revisar publisher/broker."

  - alert: BrokerConsumerLagHigh
    expr: histogram_quantile(0.95, sum(rate(broker_consumer_lag_seconds_bucket[5m])) by (le)) > 300
    for: 5m
    labels:
      severity: warning
      owner: plataforma
    annotations:
      summary: "Broker consumer lag > 5 min"
      description: "El p95 del tiempo entre publicación y consumo de eventos ha superado los 5 minutos."
      action: "Revisar consumidores (escalar)."

  - alert: DLQGrowingFast
    expr: rate(dlq_messages_total[5m]) * 60 > 2
    labels:
      severity: critical
      owner: plataforma
    annotations:
      summary: "DLQ creciendo"
      description: "Mensajes agotando reintentos y cayendo a la dead-letter queue a un ritmo sostenido."
      action: "Revisar schema/consumidores."

# Salud genérica de TODOS los microservicios (no solo el checkout). Estas reglas
# usan el label `instance` del job `nestjs-microservices`, así que cubren los 9
# servicios sin enumerarlos: al añadir un servicio al scrape queda alertado solo.
- name: PlatformHealth
  rules:
  - alert: ServiceDown
    expr: up{job="nestjs-microservices"} == 0
    for: 1m
    labels:
      severity: critical
      owner: plataforma
    annotations:
      summary: "Servicio caído: {{ $labels.instance }}"
      description: "Prometheus no puede scrapear {{ $labels.instance }} desde hace >1 min (proceso caído o /telemetry/metrics inaccesible)."
      action: "Revisar contenedor/logs del servicio; confirmar readiness (/api/health/ready)."

  - alert: ServiceHighErrorRate
    expr: |
      sum by (instance) (rate(http_requests_total{status_code=~"5.."}[5m]))
        /
      sum by (instance) (rate(http_requests_total[5m])) > 0.05
    for: 5m
    labels:
      severity: warning
      owner: plataforma
    annotations:
      summary: "Tasa de error 5xx > 5% en {{ $labels.instance }}"
      description: "Más del 5% de las peticiones HTTP de {{ $labels.instance }} devuelven 5xx en los últimos 5 min."
      action: "Revisar logs (Loki) del servicio filtrando por errorCode; correlacionar con trazas."

  - alert: ServiceHighLatencyP95
    expr: histogram_quantile(0.95, sum by (le, instance) (rate(http_request_duration_seconds_bucket[5m]))) > 2
    for: 5m
    labels:
      severity: warning
      owner: plataforma
    annotations:
      summary: "Latencia p95 > 2s en {{ $labels.instance }}"
      description: "El p95 de latencia HTTP de {{ $labels.instance }} supera los 2 s durante 5 min."
      action: "Revisar dependencias/BD del servicio; ver panel Servicios RED y trazas lentas en Jaeger."
